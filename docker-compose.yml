version: '3.8'

services:
  # MongoDB Persistent Database
  mongodb:
    image: mongo:7-jammy
    container_name: examsphere_mongodb
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: examsphere

  # Redis Scalability & In-Memory Adapter
  redis:
    image: redis:7-alpine
    container_name: examsphere_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  # ExamSphere Express & Socket.IO Backend
  backend:
    build: ./server
    container_name: examsphere_backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/examsphere
      REDIS_URL: redis://redis:6379
      JWT_SECRET: examsphere_enterprise_super_secret_jwt_key_2026
      CLIENT_URL: http://localhost:5173
      VOICE_INTEGRITY_MODE: RULE_BASED
    depends_on:
      - mongodb
      - redis

  # ExamSphere React & Vite Frontend
  frontend:
    build: ./client
    container_name: examsphere_frontend
    restart: always
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  mongo_data:
  redis_data:
